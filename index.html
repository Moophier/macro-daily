<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宏观经济日报</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mu:#6b7280;--bd:#e3e6ec;--ac:#1f4fd8;--up:#d33a3a;--dn:#1a9b5b;--c2:#8a94a6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b94a3;--bd:#272d38;--ac:#6c93ff;--up:#ef5f5f;--dn:#3cc183;--c2:#6b7587}}
:root[data-theme=dark]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b94a3;--bd:#272d38;--ac:#6c93ff;--up:#ef5f5f;--dn:#3cc183;--c2:#6b7587}
:root[data-cc=intl]{--up:#1a9b5b;--dn:#d33a3a}
:root[data-cc=intl][data-theme=dark],:root[data-cc=intl]:not([data-theme=light]) .x{--up:#3cc183;--dn:#ef5f5f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.w{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;border-bottom:2px solid var(--tx);padding-bottom:12px}
h1{margin:0;font:700 26px/1.2 "Songti SC","Noto Serif SC",serif}.sub{color:var(--mu);font-size:13px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-top:16px}
h2{font-size:16px;margin:0 0 10px;border-left:4px solid var(--ac);padding-left:8px}
.hl{font:700 20px/1.4 "Songti SC","Noto Serif SC",serif;margin:0 0 8px}
.grid{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}.two{grid-template-columns:1.6fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.kpi{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;cursor:pointer}.kpi:hover,.kpi.on{border-color:var(--ac)}
.kpi b{font-size:21px}.kpi small{color:var(--mu)}.u{color:var(--up)}.d{color:var(--dn)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
svg{width:100%;height:auto;display:block}.ch{position:relative}.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:12px;display:none;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-weight:500}
.tw{overflow-x:auto}.tag{padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--bd)}.hit{color:var(--dn)}.miss{color:var(--up)}.pen{color:var(--mu)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}.st div{border:1px solid var(--bd);border-radius:8px;padding:6px 10px}.st small{color:var(--mu);display:block}.st b{font-size:17px}
ul{margin:0;padding-left:20px}p{margin:.4em 0}.note{color:var(--mu);font-size:12.5px}.demo{background:#fff4d6;color:#7a5600;border-radius:6px;padding:6px 10px;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="w x" id="app">
<header>
  <div><h1 id="title"></h1><div class="sub" id="meta"></div></div>
  <div><button id="cc" title="涨跌配色">红涨绿跌</button> <button id="th">明/暗</button></div>
</header>
<div id="demo"></div>

<div class="card"><p class="hl" id="hl"></p><ul id="sum"></ul><div id="auto" style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--bd)"></div></div>

<div class="card"><h2>市场仪表盘</h2><div class="grid k" id="kpis"></div></div>

<div class="card"><h2 id="ctitle">走势</h2>
  <div class="tools" id="rng"></div><div class="ch" id="main"></div></div>

<div class="grid two">
  <div class="card"><h2>正文</h2><div id="secs"></div></div>
  <div class="card"><h2>未来一周日历</h2><div class="tw"><table id="cal"></table></div></div>
</div>

<div class="card"><h2>观点追踪与评价</h2>
  <div class="st" id="vst"></div>
  <div class="tw"><table id="vt"></table></div>
  <p class="note">规则：以观点发布日起首个交易日收盘价为基准，持有评价窗口（交易日）后看方向是否一致；窗口未满则按最新价浮动评价并标记「进行中」。利率类用点数变化，其余用涨跌幅。</p></div>

<div class="card"><h2>策略回测</h2>
  <div class="tools">
    标的 <select id="ba"></select>
    规则 <select id="br"><option value="ma">均线趋势（快线&gt;慢线持有）</option><option value="mom">动量（N日收益&gt;0持有）</option></select>
    <span id="p1">快</span><input id="bf" type="number" value="20" min="2" style="width:64px">
    <span id="p2">慢</span><input id="bs" type="number" value="60" min="3" style="width:64px">
    成本(bp) <input id="bc" type="number" value="2" min="0" style="width:60px">
    <button id="go" class="on">运行</button></div>
  <div class="st" id="bst"></div><div class="ch" id="bch"></div>
  <p class="note">信号以当日收盘计算、次日生效（无未来函数）；仅做多/空仓；不含融资、税费与滑点之外的成本。回测不代表未来表现。</p></div>

<p class="note">免责声明：本页内容仅供参考，不构成投资建议。</p>
</div>
<script src="data.js"></script>
<script>
const D=window.DATA,$=id=>document.getElementById(id),S=D.series,keys=Object.keys(S);
const f=(v,d=2)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const cls=v=>v>0?'u':v<0?'d':'';
const root=document.documentElement;
$('th').onclick=()=>{const dk=getComputedStyle(root).getPropertyValue('--bg').trim()=='#0e1116';root.dataset.theme=dk?'light':'dark'};
$('cc').onclick=()=>{const i=root.dataset.cc=='intl';root.dataset.cc=i?'cn':'intl';$('cc').textContent=i?'红涨绿跌':'绿涨红跌'};
$('title').textContent=D.meta.title;document.title=D.meta.title+' '+D.meta.date;
const asof=keys.map(k=>S[k].dates.slice(-1)[0]).sort().pop();
$('meta').textContent=`${D.meta.org} · ${D.meta.date} · ${D.meta.issue} · 行情截至 ${asof}（日线收盘，非实时）`+(D.meta.updated?` · 更新于 ${D.meta.updated}`:'');
if(D.auto&&D.auto.items&&D.auto.items.length)$('auto').innerHTML=`<b>行情自动速览</b> <span class="note">（程序根据 ${D.auto.asof} 数据生成，仅描述数据）</span><ul>`+D.auto.items.map(x=>`<li>${x}</li>`).join('')+'</ul>';
if(D.meta.demo)$('demo').innerHTML='<div class="demo">当前为演示数据（随机生成），请在 data.js 中替换为真实数据。</div>';
$('hl').textContent=D.headline;$('sum').innerHTML=D.summary.map(s=>`<li>${s}</li>`).join('');
$('secs').innerHTML=D.sections.map(s=>`<p><b>${s.title}</b></p>`+s.body.map(b=>`<p>${b}</p>`).join('')).join('');
$('cal').innerHTML='<tr><th>日期</th><th>时间</th><th>地区</th><th>事件</th><th>重要</th></tr>'+D.calendar.map(c=>`<tr><td>${c.d}</td><td>${c.t}</td><td>${c.c}</td><td>${c.e}</td><td>${'★'.repeat(c.imp)}</td></tr>`).join('');

/* ---- 通用折线图 ---- */
function chart(el,dates,lines){
  const W=760,H=300,L=52,R=10,T=10,B=24;
  const all=lines.flatMap(l=>l.v);let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
  const n=dates.length,x=i=>L+(W-L-R)*i/(n-1||1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${f(v,Math.abs(hi)<20?2:0)}</text>`}
  for(let k=0;k<=4;k++){const i=Math.round((n-1)*k/4);g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${k==0?'start':k==4?'end':'middle'}" font-size="11" fill="var(--mu)">${dates[i].slice(2)}</text>`}
  const cols=['var(--ac)','var(--c2)'];
  g+=lines.map((l,j)=>`<polyline fill="none" stroke="${cols[j]}" stroke-width="1.8" points="${l.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`).join('');
  g+=lines.length>1?lines.map((l,j)=>`<text x="${L+8+j*130}" y="${T+12}" font-size="12" fill="${cols[j]}">● ${l.name}</text>`).join(''):'';
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}<line id="cx" y1="${T}" y2="${H-B}" stroke="var(--mu)" stroke-dasharray="3" style="display:none"/></svg><div class="tip"></div>`;
  const svg=el.firstChild,cx=svg.querySelector('#cx'),tip=el.lastChild;
  svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;const i=Math.max(0,Math.min(n-1,Math.round((px-L)/(W-L-R)*(n-1))));
    cx.style.display='';cx.setAttribute('x1',x(i));cx.setAttribute('x2',x(i));tip.style.display='block';tip.style.left=Math.min(e.clientX-r.left+12,r.width-150)+'px';tip.style.top='8px';
    tip.innerHTML=dates[i]+'<br>'+lines.map(l=>`${l.name} ${f(l.v[i],3)}`).join('<br>')};
  svg.onmouseleave=()=>{cx.style.display='none';tip.style.display='none'};
}

/* ---- KPI ---- */
let cur=keys[0],days=130;
function kpis(){
  $('kpis').innerHTML=keys.map(k=>{const s=S[k],v=s.values,n=v.length,l=v[n-1],p=v[n-2],isr=s.type=='rate';
    const ch=isr?(l-p)*(s.unit=='%'?100:1):(l/p-1)*100,t=isr?(s.unit=='%'?f(ch,1)+' bp':f(ch,2)):f(ch,2)+'%';
    const sp=v.slice(-60),a=Math.min(...sp),b=Math.max(...sp),pts=sp.map((q,i)=>`${i*3},${28-(q-a)/(b-a||1)*26}`).join(' ');
    return `<div class="kpi ${k==cur?'on':''}" data-k="${k}"><small>${s.name}</small><br><b>${f(l,l>100?2:3)}</b> <span class="${cls(ch)}">${ch>0?'+':''}${t}</span><svg viewBox="0 0 177 30" style="height:30px"><polyline fill="none" stroke="var(--ac)" stroke-width="1.5" points="${pts}"/></svg></div>`}).join('');
  document.querySelectorAll('.kpi').forEach(e=>e.onclick=()=>{cur=e.dataset.k;kpis();main()});
}
function main(){const s=S[cur];$('ctitle').textContent=s.name+' 走势'+(s.unit?`（${s.unit}）`:'');
  chart($('main'),s.dates.slice(-days),[{name:s.name,v:s.values.slice(-days)}])}
$('rng').innerHTML=[['1月',21],['3月',63],['6月',126],['1年',252],['全部',9999]].map(([t,d])=>`<button data-d="${d}" class="${d==130?'':''}">${t}</button>`).join('');
$('rng').onclick=e=>{if(e.target.dataset.d){days=+e.target.dataset.d;[...$('rng').children].forEach(b=>b.classList.toggle('on',b==e.target));main()}};
kpis();main();

/* ---- 观点追踪 ---- */
function track(){
  let rows='',h=0,m=0,pe=0,sumR=0,nR=0;
  D.views.slice().sort((a,b)=>b.date<a.date?-1:1).forEach(w=>{
    const s=S[w.asset];if(!s)return;const i0=s.dates.findIndex(d=>d>=w.date);if(i0<0)return;
    const last=s.values.length-1,i1=Math.min(i0+w.h,last),done=i0+w.h<=last,isr=s.type=='rate';
    const ret=isr?(s.values[i1]-s.values[i0])*(s.unit=='%'?100:1):(s.values[i1]/s.values[i0]-1)*100;
    const ok=Math.sign(ret)==w.dir,aligned=ret*w.dir;
    if(done){ok?h++:m++;sumR+=aligned;nR++}else pe++;
    rows+=`<tr><td>${w.date}</td><td>${s.name}</td><td>${w.dir>0?'看多/上行':'看空/下行'}</td><td>${w.text}</td><td>${w.h}日</td><td class="${cls(ret)}">${ret>0?'+':''}${f(ret,isr?1:2)}${isr?'bp':'%'}</td><td><span class="tag ${done?(ok?'hit':'miss'):'pen'}">${done?(ok?'命中':'未命中'):'进行中'}</span></td></tr>`});
  $('vt').innerHTML='<tr><th>日期</th><th>标的</th><th>方向</th><th>观点</th><th>窗口</th><th>区间表现</th><th>评价</th></tr>'+rows;
  $('vst').innerHTML=[['已结算',h+m],['命中',h],['胜率',h+m?f(h/(h+m)*100,0)+'%':'-'],['进行中',pe],['方向调整后平均收益',nR?f(sumR/nR,2):'-']].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('');
}
track();

/* ---- 回测 ---- */
const px=keys.filter(k=>S[k].type=='px');$('ba').innerHTML=px.map(k=>`<option value="${k}">${S[k].name}</option>`).join('');
$('br').onchange=()=>{const m=$('br').value=='mom';$('p1').textContent=m?'回看N日':'快';$('p2').style.display=$('bs').style.display=m?'none':'';if(m)$('bf').value=60;else{$('bf').value=20}};
function stats(eq){const n=eq.length,r=[];for(let i=1;i<n;i++)r.push(eq[i]/eq[i-1]-1);
  const mu=r.reduce((a,b)=>a+b,0)/r.length,sd=Math.sqrt(r.reduce((a,b)=>a+(b-mu)**2,0)/r.length);
  let pk=1,dd=0;eq.forEach(v=>{pk=Math.max(pk,v);dd=Math.min(dd,v/pk-1)});
  return{tot:eq[n-1]-1,ann:Math.pow(eq[n-1],252/n)-1,vol:sd*Math.sqrt(252),sh:sd?mu/sd*Math.sqrt(252):0,dd}}
function run(){
  const s=S[$('ba').value],v=s.values,n=v.length,rule=$('br').value,a=+$('bf').value,b=+$('bs').value,c=+$('bc').value/1e4;
  const cs=[0];v.forEach((q,i)=>cs.push(cs[i]+q));const ma=(i,k)=>(cs[i+1]-cs[i+1-k])/k;
  const pos=new Array(n).fill(0);
  for(let i=1;i<n;i++){if(rule=='ma'){if(i>=b-1)pos[i]=ma(i,a)>ma(i,b)?1:0}else if(i>=a)pos[i]=v[i]>v[i-a]?1:0}
  const eq=[1],bh=[1];let tr=0,inm=0;
  for(let i=1;i<n;i++){const r=v[i]/v[i-1]-1,p=pos[i-1],t=Math.abs(p-(i>1?pos[i-2]:0));tr+=t;inm+=p;
    eq.push(eq[i-1]*(1+p*r-t*c));bh.push(bh[i-1]*(1+r))}
  const A=stats(eq),B=stats(bh),pc=x=>f(x*100,1)+'%';
  const item=(t,x,y)=>`<div><small>${t}</small><b>${x}</b> <span class="note">基准 ${y}</span></div>`;
  $('bst').innerHTML=item('累计收益',pc(A.tot),pc(B.tot))+item('年化收益',pc(A.ann),pc(B.ann))+item('年化波动',pc(A.vol),pc(B.vol))+item('夏普',f(A.sh),f(B.sh))+item('最大回撤',pc(A.dd),pc(B.dd))+`<div><small>换手次数 / 持仓占比</small><b>${Math.round(tr)} / ${pc(inm/(n-1))}</b></div>`;
  chart($('bch'),s.dates,[{name:'策略净值',v:eq},{name:'买入持有',v:bh}]);
}
$('go').onclick=run;run();
</script>
</body>
</html>
