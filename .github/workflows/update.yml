name: update-daily-data
on:
  schedule:
    - cron: "30 22 * * 1-5"   # UTC 22:30 = 北京时间次日 06:30，美股收盘之后
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance akshare pandas requests
      - run: python scripts/fetch_data.py
      - run: python scripts/gen_summary.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: commit
        run: |
          git config user.name "daily-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F)" && git push)
